name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Run Ruff
        run: |
          ruff check .

      - name: Run tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/devops
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: test-secret
        run: |
          python -m pytest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/sadnorth/devops-platform:latest
            ghcr.io/sadnorth/devops-platform:${{ steps.vars.outputs.sha_short }}

  deploy:
    needs: test
    runs-on: self-hosted

    permissions:
      contents: read
      actions: write

    steps:
      - name: Deploy Application
        run: |
          cd ~/Projects/HomeLab/ansible
          ansible-playbook playbooks/deploy.yml \
            -e image_tag=${GITHUB_SHA::7}

      - name: Save last known good version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh variable set LAST_KNOWN_GOOD_TAG \
            --repo SadNorth/devops-platform \
            --body "${GITHUB_SHA::7}"

      - name: Upload last known good version
        uses: actions/upload-artifact@v4
        with:
          name: last_known_good
          path: last_known_good
          retention-days: 90