services:

  backend:

    build:
      context: ./backend
    container_name: backend

    networks:
      - backend_network

    expose:
      - "8000"

    env_file:
      - ./backend/.env

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:

    image: postgres:17

    container_name: postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    networks:
      - backend_network

    expose:
      - "5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  redis:

    image: redis:7-alpine

    container_name: redis

    networks:
      - backend_network

    expose:
      - "6379"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:1.28-alpine

    container_name: nginx

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    networks:
      - backend_network

    restart: unless-stopped

networks:
  backend_network:
    driver: bridge

volumes:

  postgres_data: